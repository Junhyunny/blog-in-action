<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO 내보내기</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            color: #1f2937;
            background: #f3f4f6;
            font-family: system-ui, sans-serif;
        }

        main {
            width: min(420px, calc(100% - 48px));
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgb(0 0 0 / 8%);
        }

        h1 { margin-top: 0; }
        p { color: #6b7280; }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .download-button {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .download-button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<main>
    <h1>TODO 데이터</h1>
    <p>전체 TODO 데이터를 CSV 파일로 다운로드합니다.</p>
    <div class="actions">
        <a class="download-button" href="/export" download="todos.csv">CSV 다운로드</a>
        <a class="download-button" href="/legacy/export" download="todos-legacy.csv">
            Legacy CSV 다운로드
        </a>
    </div>
</main>
</body>
</html>
